<!DOCTYPE html>
<html>
<head>
    <title>Event Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="jelly-bg"></div>

    <br><br>
    <div class="container container-box">
        <center><center><h1>My Event Tracker</h1></center></center>
        <p class="subtitle" style="text-align: center; color: gray;">Everything I need to show up for.</p>
        
        <div class="form-box">
            <form id="addEventForm">
                <div class="input-group" id="group1">
                    <label>Event Name:</label>
                    <div class="input-wrapper">
                        <input type="text" id="eventName" required placeholder="Web Dev Hackathon">
                    </div>
                </div>
                
                <div class="input-group" id="group2">
                    <label>Date:</label>
                    <div class="input-wrapper">
                        <input type="date" id="eventDate" required>
                    </div>
                </div>
                
                <div class="input-group" id="group3">
                    <label>Time (optional):</label>
                    <div class="input-wrapper">
                        <input type="time" id="eventTime">
                    </div>
                </div>
                
                <div class="input-group" id="group4">
                    <label>Event Type:</label>
                    <div class="input-wrapper">
                        <select id="eventType" required onchange="checkIfOther()">
                            <option value="hackathon">Hackathon</option>
                            <option value="deadline">Deadline</option>
                            <option value="exam">Exam</option>
                            <option value="event">Event</option>
                            <option value="other">Other...</option>
                        </select>
                        <input type="text" id="otherBox" placeholder="What is it?">
                    </div>
                </div>
                
                <div id="emptyDiv"></div>
                
                <div id="sneakyCharacter" class="sneaky-container">
                    <div id="pinkSpy" class="spy-char pink-spy">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="mouth sad"></div>
                    </div>

                    <div id="blueSpy" class="spy-char blue-spy">
                        <div class="eyes">
                            <div class="eye"></div>
                            <div class="eye"></div>
                        </div>
                        <div class="mouth smile"></div>
                    </div>
                </div>

                <br>
                <button type="submit" class="submit-btn">Add Event</button>
            </form>
        </div>

        <div></div>
        <h2>Upcoming:</h2>
        <div id="eventsContainer">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
